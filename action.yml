name: Vallkey key scan
description: Fail the build when an API key is committed. Each key is marked on its line, masked, and listed in the run summary.
author: Vallkey
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: The folder to scan, relative to the repository root.
    default: .
  history:
    description: Also scan every commit in the git history. Needs fetch-depth 0 on actions/checkout.
    default: "false"
  fail:
    description: Fail the job when keys are found. Set to false to only report them.
    default: "true"
  allowlist:
    description: Optional repository-relative JSON file containing exact path and value-hash exceptions.
    default: ""
  version:
    description: The version of the vallkey command line tool to run.
    default: 0.8.1

outputs:
  found:
    description: How many API keys were found.
    value: ${{ steps.scan.outputs.found }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        VALLKEY_PATH: ${{ inputs.path }}
        VALLKEY_HISTORY: ${{ inputs.history }}
        VALLKEY_FAIL: ${{ inputs.fail }}
        VALLKEY_ALLOWLIST: ${{ inputs.allowlist }}
        VALLKEY_VERSION: ${{ inputs.version }}
      run: |
        set -uo pipefail
        if ! command -v npx >/dev/null; then
          echo "::error title=Vallkey::Node.js is required. Add actions/setup-node before this step."
          exit 2
        fi
        if [[ ! "$VALLKEY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error title=Vallkey::version must look like 1.2.3"
          exit 2
        fi
        for value in "$VALLKEY_HISTORY" "$VALLKEY_FAIL"; do
          if [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error title=Vallkey::history and fail must be true or false"
            exit 2
          fi
        done
        args=(scan)
        if [ "$VALLKEY_HISTORY" = "true" ]; then
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            echo "::warning title=Vallkey::The checkout is shallow; use fetch-depth: 0 to scan all history."
          fi
          args+=(--history)
        fi
        if [ -n "$VALLKEY_ALLOWLIST" ]; then
          args+=(--allowlist "$VALLKEY_ALLOWLIST")
        fi
        args+=(-- "$VALLKEY_PATH")
        report=$(mktemp "$RUNNER_TEMP/vallkey-scan.XXXXXX") || exit 2
        trap 'rm -f "$report"' EXIT
        npx --yes "vallkey@$VALLKEY_VERSION" "${args[@]}" | tee "$report"
        statuses=("${PIPESTATUS[@]}")
        code=${statuses[0]}
        if [ "${statuses[1]}" -ne 0 ]; then
          exit "${statuses[1]}"
        fi
        found=$(grep -cE '^::(error|warning) file=' "$report" || true)
        echo "found=$found" >> "$GITHUB_OUTPUT" || exit 2
        if [ "$code" -gt 1 ] || { [ "$code" -ne 0 ] && [ "$found" -eq 0 ]; }; then
          exit "$code"
        fi
        if [ "$found" -gt 0 ] && [ "$VALLKEY_FAIL" = "true" ]; then
          exit 1
        fi
        exit 0
