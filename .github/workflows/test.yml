name: Test

# Runs the action on this repository: it must find no keys, and say so.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scan
        uses: ./
        with:
          history: true
      - name: Check the result
        env:
          FOUND: ${{ steps.scan.outputs.found }}
        run: test "$FOUND" = "0"
