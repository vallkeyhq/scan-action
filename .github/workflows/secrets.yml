name: Secret scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Install pinned scanner
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan source and history
        run: |
          "$RUNNER_TEMP/bin/gitleaks" dir . --redact --no-banner
          "$RUNNER_TEMP/bin/gitleaks" git . --redact --no-banner
