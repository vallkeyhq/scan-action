name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Do not include credentials or customer data."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Component version, operating system, runtime version, and relevant HTTP client or SDK.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or code using synthetic credentials.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
